name: db-ci

# The database must build from an empty MongoDB, rerun with no change, roll back to empty and build again
# (Annex B). tests/db-ci.sh starts its own throwaway replica set and runner image.
# Pull requests toward develop and qa only, to save the course's automation minutes. No schedule.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build, rerun, roll back and rebuild
        run: sh db/tests/db-ci.sh
